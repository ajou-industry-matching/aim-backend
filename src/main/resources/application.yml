server:
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework

spring:
  application:
    name: aim-be

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/aim?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USER:aim_be}
    password: ${DB_PASSWORD:}

  jpa:
    database: mysql
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}
    json: ${FIREBASE_CREDENTIALS_JSON:}
  storage:
    bucket: ${FIREBASE_STORAGE_BUCKET:ajou-project-cafd9.firebasestorage.app}
