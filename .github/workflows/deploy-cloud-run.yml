name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  CLOUD_RUN_REGION: asia-northeast3
  CLOUD_RUN_SERVICE: aim-be-prod
  ARTIFACT_REGISTRY_REGION: asia-northeast3
  ARTIFACT_REGISTRY_REPOSITORY: app-repo
  IMAGE_NAME: aim-be
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  SPRING_PROFILES_ACTIVE: prod
  DB_URL: ${{ secrets.DB_URL }}
  DB_USER: ${{ vars.DB_USER || 'aim_be' }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DDL_AUTO: ${{ vars.DDL_AUTO || 'validate' }}
  SPRING_JPA_HIBERNATE_DDL_AUTO: ${{ vars.DDL_AUTO || 'validate' }}
  FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || 'ajou-project-cafd9.firebasestorage.app' }}
  FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
  CRAWLER_API_KEY: ${{ secrets.CRAWLER_API_KEY }}

jobs:
  deploy:
    name: Build image and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate deployment configuration
        run: bash .github/scripts/validate-deploy-env.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # 민감값 4개를 GitHub Secrets를 원본으로 Secret Manager에 동기화한다.
      # (없으면 생성, 있으면 새 버전 추가 — 파이프라인이 스스로 시크릿을 프로비저닝)
      - name: Ensure secrets exist
        run: |
          set -euo pipefail
          for name in DB_URL DB_PASSWORD FIREBASE_CREDENTIALS_JSON CRAWLER_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              if gcloud secrets describe "$name" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
                printf %s "$value" | gcloud secrets versions add "$name" --project "$GCP_PROJECT_ID" --data-file=-
              else
                printf %s "$value" | gcloud secrets create "$name" --project "$GCP_PROJECT_ID" --data-file=- --replication-policy=automatic
              fi
            fi
            if ! gcloud secrets describe "$name" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              echo "GCP Secret Manager secret $name does not exist. Set GitHub Secret $name once, or run backend-secrets-setup.sh." >&2
              exit 1
            fi
          done

      - name: Configure Artifact Registry Docker auth
        run: gcloud auth configure-docker "${ARTIFACT_REGISTRY_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ env.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.CLOUD_RUN_REGION }}
          # Firebase Hosting rewrite가 서비스를 호출하려면 미인증 invoke가 허용돼야 한다.
          # 명시하지 않으면 새 리전/신규 서비스가 private로 생성돼 /api가 403이 된다. (앱 인증은 Firebase 토큰으로 별도 수행)
          flags: '--allow-unauthenticated'
          # overwrite: 서비스의 env/secret 집합을 아래 값으로 '권위 있게' 덮어쓴다.
          # (merge 로 두면 기존 plaintext DB_URL 등이 서비스에 남아 시크릿 이전이 무효화됨)
          env_vars_update_strategy: overwrite
          env_vars: |-
            SPRING_PROFILES_ACTIVE=${{ env.SPRING_PROFILES_ACTIVE }}
            DB_USER=${{ env.DB_USER }}
            DDL_AUTO=${{ env.DDL_AUTO }}
            SPRING_JPA_HIBERNATE_DDL_AUTO=${{ env.SPRING_JPA_HIBERNATE_DDL_AUTO }}
            FIREBASE_STORAGE_BUCKET=${{ env.FIREBASE_STORAGE_BUCKET }}
            SPRING_FLYWAY_ENABLED=true
            SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
            SPRING_FLYWAY_BASELINE_VERSION=1
          # 민감값 4개는 Secret Manager에서 환경변수로 주입된다. (앱은 그대로 env로 읽음)
          secrets_update_strategy: overwrite
          secrets: |-
            DB_URL=DB_URL:latest
            DB_PASSWORD=DB_PASSWORD:latest
            FIREBASE_CREDENTIALS_JSON=FIREBASE_CREDENTIALS_JSON:latest
            CRAWLER_API_KEY=CRAWLER_API_KEY:latest
